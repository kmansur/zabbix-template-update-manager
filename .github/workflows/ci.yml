name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'refactor/**'
      - 'docs/**'
      - 'test/**'
      - 'ci/**'
      - 'chore/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate module
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure PHP CLI
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v php >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y php-cli
          fi
          php --version

      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name '*.php' -print0)

      - name: Validate manifest
        run: php tests/validate_manifest.php

      - name: Enforce module view namespace
        run: php tests/module_view_namespace_guard.php

      - name: Validate version
        run: php tests/validate_version.php

      - name: Enforce controlled-write boundary
        run: php tests/read_only_guard.php

      - name: Enforce native Zabbix UI
        run: php tests/ui_native_guard.php

      - name: Enforce accessibility contracts
        run: php tests/accessibility_guard.php

      - name: Enforce runtime security guard
        run: php tests/security_guard.php

      - name: PHP unit tests
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/unit/*Test.php; do
            php "$test"
          done

      - name: Validate shell helpers
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/ztum-runtime-setup.sh
          bash -n tools/quickinstall.sh
          bash -n tools/quickinstall-pt-br.sh
          bash -n tests/test_runtime_setup.sh

      - name: Validate runtime setup helper
        run: tests/test_runtime_setup.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install generator dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Validate upstream index generator
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/build_upstream_index.py tools/build_offline_bundle.py tools/aggregate_coverage.py tools/check_zabbix_frontend_compat.py
          python tests/test_build_upstream_index.py
          python tests/test_build_offline_bundle.py
          python tests/test_zabbix_frontend_compat.py
          python tests/test_workflows.py

  php-runtime-matrix:
    name: PHP ${{ matrix.php }} runtime
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    container:
      image: php:${{ matrix.php }}-cli-bookworm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runtime version
        run: php --version

      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name '*.php' -print0)

      - name: PHP unit tests
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/unit/*Test.php; do
            php "$test"
          done

  zabbix-frontend-compat:
    name: Frontend symbols / Zabbix ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: '7.0'
            ref: 'release/7.0'
          - label: '8.0'
            ref: 'master'

    steps:
      - name: Checkout ZTUM
        uses: actions/checkout@v4
        with:
          path: ztum

      - name: Checkout Zabbix frontend
        uses: actions/checkout@v4
        with:
          repository: zabbix/zabbix
          ref: ${{ matrix.ref }}
          path: zabbix
          sparse-checkout: |
            ui
            include/version.h
          sparse-checkout-cone-mode: false

      - name: Verify expected Zabbix generation
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '#define ZABBIX_VERSION_MAJOR[[:space:]]+${{ matrix.label == '7.0' && '7' || '8' }}' zabbix/include/version.h

      - name: Check native frontend symbols
        run: |
          python3 ztum/tools/check_zabbix_frontend_compat.py \
            --module-root ztum \
            --zabbix-root zabbix \
            --label "Zabbix ${{ matrix.label }}"


  browser-assets:
    name: Chromium batch UI smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pinned browser test dependency
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser regression
        run: npm run test:browser


  release-package-smoke:
    name: Release package smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and verify release-shaped archives
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          prefix="zabbix-template-update-manager-$version/"
          mkdir -p dist
          git archive --format=tar.gz --prefix="$prefix" -o "dist/zabbix-template-update-manager-$version.tar.gz" HEAD
          git archive --format=zip --prefix="$prefix" -o "dist/zabbix-template-update-manager-$version.zip" HEAD
          (cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS && sha256sum -c SHA256SUMS)
          for required in manifest.json VERSION LICENSE NOTICE.md assets/js/ztum-update-batch.js assets/js/ztum-install-batch.js; do
            tar -tzf "dist/zabbix-template-update-manager-$version.tar.gz" | grep -Fx "$prefix$required"
          done
          unzip -t "dist/zabbix-template-update-manager-$version.zip"
