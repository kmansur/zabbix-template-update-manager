name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'refactor/**'
      - 'docs/**'
      - 'test/**'
      - 'ci/**'
      - 'chore/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate module
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure PHP CLI
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v php >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y php-cli
          fi
          php --version

      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name '*.php' -print0)

      - name: Validate manifest
        run: php tests/validate_manifest.php

      - name: Validate version
        run: php tests/validate_version.php

      - name: Enforce controlled-write boundary
        run: php tests/read_only_guard.php

      - name: PHP unit tests
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/unit/*Test.php; do
            php "$test"
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install generator dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Validate upstream index generator
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/build_upstream_index.py
          python tests/test_build_upstream_index.py
