name: One-time publish beta59 tag

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

jobs:
  tag-and-dispatch:
    if: github.repository == 'kmansur/zabbix-template-update-manager'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main with parent
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Create immutable beta.59 tag at pre-helper main commit
        id: tag
        shell: bash
        run: |
          set -euo pipefail

          target_commit="$(git rev-parse "$GITHUB_SHA^")"
          version="$(git show "$target_commit:VERSION" | tr -d '\r\n')"
          test "$version" = "0.1.0-beta.59"
          tag="v$version"

          git fetch --tags origin

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            tagged_commit="$(git rev-list -n1 "$tag")"
            test "$tagged_commit" = "$target_commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" "$target_commit" -m "Template Update Manager $version"
            git push origin "refs/tags/$tag"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "target_commit=$target_commit" >> "$GITHUB_OUTPUT"

      - name: Dispatch release workflow for immutable tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release.yml --ref main -f tag="$RELEASE_TAG"

      - name: Remove merged topic branches
        shell: bash
        run: |
          set -euo pipefail
          for branch in \
            hardening/pre-rc-foundation \
            release/beta59-prerelease \
            chore/publish-beta59-tag
          do
            git push origin --delete "$branch" >/dev/null 2>&1 || true
          done
