name: One-time repository branch cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    name: Remove stale development branches
    runs-on: ubuntu-latest

    steps:
      - name: Delete historical merged branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Keeping:"
          echo "  main"
          echo "  upstream-index"
          echo "  dependabot/**"
          echo

          gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100"             --jq '.[].name' > /tmp/ztum-branches.txt

          while IFS= read -r branch; do
            case "$branch" in
              main|upstream-index|dependabot/*)
                echo "KEEP   $branch"
                ;;
              feature/*|fix/*|refactor/*|docs/*|release/*|test/*|ux/*|work/*|chore/*)
                echo "DELETE $branch"
                gh api --method DELETE                   "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
                ;;
              *)
                echo "KEEP   $branch (not matched by cleanup policy)"
                ;;
            esac
          done < /tmp/ztum-branches.txt
