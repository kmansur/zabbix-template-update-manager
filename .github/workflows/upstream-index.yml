name: Refresh upstream template indexes

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/upstream-index.yml'
      - 'tools/build_upstream_index.py'
      - 'requirements-dev.txt'
      - 'VERSION'
      - 'src/Repository/UpstreamIndexRepository.php'
      - 'src/Support/ProjectVersion.php'
      - 'src/Support/ZabbixVersion.php'
      - 'tests/validate_generated_indexes.php'

permissions:
  contents: write

concurrency:
  group: upstream-template-index
  cancel-in-progress: false

jobs:
  refresh:
    name: Build official Zabbix template indexes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install generator dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Build indexes
        shell: bash
        run: |
          set -euo pipefail

          # Resolve refs against the canonical full-history repository. Prefer
          # the official GitHub mirror for refs it exposes because it is more
          # reliable for Actions; historical refs fall back to git.zabbix.com.
          CANONICAL_REPO='https://git.zabbix.com/scm/zbx/zabbix.git'
          MIRROR_REPO='https://github.com/zabbix/zabbix.git'
          mkdir -p build/upstream

          resolve_ref() {
            local line="$1"
            local branch="release/${line}"
            local tag

            if git ls-remote --exit-code --heads "$CANONICAL_REPO" "$branch" >/dev/null 2>&1; then
              printf '%s\n' "$branch"
              return 0
            fi

            tag="$(git ls-remote --tags --refs "$CANONICAL_REPO" "refs/tags/${line}.*" \
              | awk -F/ '{print $3}' | sort -V | tail -n 1)"
            if [[ -n "$tag" ]]; then
              printf '%s\n' "$tag"
              return 0
            fi

            if [[ "$line" == '8.0' ]]; then
              printf '%s\n' 'master'
              return 0
            fi

            echo "Unable to resolve an official source ref for Zabbix ${line}." >&2
            return 1
          }

          repo_has_ref() {
            local repo="$1"
            local ref="$2"

            git ls-remote --exit-code --heads "$repo" "$ref" >/dev/null 2>&1 \
              || git ls-remote --exit-code --tags "$repo" "refs/tags/${ref}" >/dev/null 2>&1
          }

          clone_ref_once() {
            local repo="$1"
            local ref="$2"
            local source_dir="$3"

            rm -rf "$source_dir"
            git -c http.version=HTTP/1.1 clone \
              --depth 1 \
              --single-branch \
              --branch "$ref" \
              --filter=blob:none \
              --sparse \
              "$repo" \
              "$source_dir" \
              && git -C "$source_dir" -c http.version=HTTP/1.1 sparse-checkout set templates include
          }

          clone_ref_with_retry() {
            local ref="$1"
            local source_dir="$2"
            local preferred_repo="$CANONICAL_REPO"
            local attempt

            if repo_has_ref "$MIRROR_REPO" "$ref"; then
              preferred_repo="$MIRROR_REPO"
            fi

            for attempt in 1 2 3; do
              echo "Checkout attempt ${attempt}/3 for ${ref} from ${preferred_repo}."
              if clone_ref_once "$preferred_repo" "$ref" "$source_dir"; then
                return 0
              fi
              sleep $((attempt * 5))
            done

            if [[ "$preferred_repo" != "$CANONICAL_REPO" ]]; then
              echo "Mirror checkout failed repeatedly; falling back to canonical repository."
              for attempt in 1 2 3; do
                echo "Canonical checkout attempt ${attempt}/3 for ${ref}."
                if clone_ref_once "$CANONICAL_REPO" "$ref" "$source_dir"; then
                  return 0
                fi
                sleep $((attempt * 5))
              done
            fi

            echo "Unable to checkout official source ref ${ref} after retries." >&2
            return 1
          }

          build_line() {
            local line="$1"
            local ref
            local safe_line
            local source_dir
            local commit
            local commit_date
            local major
            local minor

            ref="$(resolve_ref "$line")"
            safe_line="${line//./-}"
            source_dir="/tmp/zabbix-${safe_line}"

            echo "Building Zabbix ${line} index from ${ref}."
            clone_ref_with_retry "$ref" "$source_dir"

            if [[ "$ref" == 'master' ]]; then
              major="$(awk '/^#define ZABBIX_VERSION_MAJOR/{print $3}' "$source_dir/include/version.h")"
              minor="$(awk '/^#define ZABBIX_VERSION_MINOR/{print $3}' "$source_dir/include/version.h")"
              if [[ "${major}.${minor}" != "$line" ]]; then
                echo "master is ${major}.${minor}, expected ${line}" >&2
                exit 1
              fi
            fi

            commit="$(git -C "$source_dir" rev-parse HEAD)"
            commit_date="$(git -C "$source_dir" show -s --format=%cI HEAD)"

            python tools/build_upstream_index.py \
              --source-dir "$source_dir" \
              --line "$line" \
              --source-ref "$ref" \
              --source-commit "$commit" \
              --source-commit-date "$commit_date" \
              --output "build/upstream/${line}.json"
          }

          build_initial_line() {
            local line="$1"
            local ref="${line}.0"
            local safe_line
            local source_dir
            local commit
            local commit_date

            safe_line="${line//./-}"
            source_dir="/tmp/zabbix-initial-${safe_line}"

            if ! git ls-remote --exit-code --tags "$CANONICAL_REPO" "refs/tags/${ref}" >/dev/null 2>&1; then
              echo "Initial immutable release tag ${ref} is unavailable." >&2
              return 1
            fi

            echo "Building immutable Zabbix ${line} initial baseline index from tag ${ref}."
            clone_ref_with_retry "$ref" "$source_dir"

            commit="$(git -C "$source_dir" rev-parse HEAD)"
            commit_date="$(git -C "$source_dir" show -s --format=%cI HEAD)"

            python tools/build_upstream_index.py               --source-dir "$source_dir"               --line "$line"               --source-ref "$ref"               --source-commit "$commit"               --source-commit-date "$commit_date"               --output "build/upstream-initial/${line}.json"
          }

          build_line '7.0'
          build_line '7.2'
          build_line '7.4'
          build_line '8.0'
          build_initial_line '7.0'
          build_initial_line '7.2'
          build_initial_line '7.4'
          build_initial_line '8.0'

      - name: Validate generated indexes with runtime decoder
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v php >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y php-cli
          fi
          php tests/validate_generated_indexes.php build/upstream
          php tests/validate_generated_indexes.php build/upstream-initial

      - name: Verify canonical raw source endpoint
        shell: bash
        run: |
          set -euo pipefail

          commit="$(python - <<'PY'
          import json
          with open('build/upstream/7.0.json', encoding='utf-8') as handle:
              print(json.load(handle)['source']['commit'])
          PY
          )"
          path='templates/os/linux/template_os_linux.yaml'
          url="https://git.zabbix.com/projects/ZBX/repos/zabbix/raw/${path}?at=${commit}"
          user_agent="Zabbix-Template-Update-Manager/$(cat VERSION)"

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --connect-timeout 10 \
            --max-time 30 \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 2 \
            --user-agent "$user_agent" \
            "$url" \
            --output /tmp/ztum-upstream-source.yaml

          grep -q '^zabbix_export:' /tmp/ztum-upstream-source.yaml

          expected_source_sha="$(python - <<'PY'
          import json

          path = 'templates/os/linux/template_os_linux.yaml'
          with open('build/upstream/7.0.json', encoding='utf-8') as handle:
              data = json.load(handle)

          matches = []
          for template in data['templates'].values():
              for source in template.get('sources', []):
                  if source.get('path') == path:
                      matches.append(source.get('sha256'))

          unique = sorted(set(matches))
          if len(unique) != 1:
              raise SystemExit(f'expected one raw source fingerprint for {path}, got {unique!r}')
          print(unique[0])
          PY
          )"
          actual_source_sha="$(sha256sum /tmp/ztum-upstream-source.yaml | awk '{print $1}')"

          if [[ "$actual_source_sha" != "$expected_source_sha" ]]; then
            echo "Canonical raw source fingerprint mismatch." >&2
            echo "Expected: $expected_source_sha" >&2
            echo "Actual:   $actual_source_sha" >&2
            exit 1
          fi

          echo "Verified canonical raw source at ${commit:0:12}: ${path} (${actual_source_sha:0:16})"

      - name: Verify canonical commit history endpoint
        shell: bash
        run: |
          set -euo pipefail

          commit="$(python - <<'PY'
          import json
          with open('build/upstream/7.0.json', encoding='utf-8') as handle:
              print(json.load(handle)['source']['commit'])
          PY
          )"
          endpoint='https://git.zabbix.com/rest/api/1.0/projects/ZBX/repos/zabbix/commits'
          user_agent="Zabbix-Template-Update-Manager/$(cat VERSION)"

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --connect-timeout 10 \
            --max-time 30 \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 2 \
            --user-agent "$user_agent" \
            --get \
            --data-urlencode 'path=templates/os/linux/template_os_linux.yaml' \
            --data-urlencode "until=${commit}" \
            --data-urlencode 'followRenames=true' \
            --data-urlencode 'limit=5' \
            "$endpoint" \
            --output /tmp/ztum-template-commits.json

          python - <<'PY'
          import json
          import re

          with open('/tmp/ztum-template-commits.json', encoding='utf-8') as handle:
              data = json.load(handle)

          values = data.get('values')
          if not isinstance(values, list) or not values:
              raise SystemExit('canonical history endpoint returned no commits')

          for commit in values:
              commit_id = commit.get('id', '')
              if not re.fullmatch(r'[0-9a-f]{40}', commit_id):
                  raise SystemExit(f'invalid commit id: {commit_id!r}')

          print(f"Verified canonical history endpoint with {len(values)} commits")
          for commit in values:
              print(commit['id'][:12], commit.get('message', '').splitlines()[0])
          PY

      - name: Publish index branch
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin upstream-index:refs/remotes/origin/upstream-index
          rm -rf /tmp/ztum-upstream-index
          git worktree add /tmp/ztum-upstream-index origin/upstream-index
          cd /tmp/ztum-upstream-index
          git switch -C upstream-index

          mkdir -p indexes initial
          rm -f indexes/*.json initial/*.json
          cp "$GITHUB_WORKSPACE"/build/upstream/*.json indexes/
          cp "$GITHUB_WORKSPACE"/build/upstream-initial/*.json initial/

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add indexes

          if git diff --cached --quiet; then
            echo 'Upstream indexes are already current.'
            exit 0
          fi

          git commit -m 'chore: refresh upstream template indexes'
          git push origin HEAD:upstream-index
