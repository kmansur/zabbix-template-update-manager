name: One-time beta50 branch cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    name: Remove merged beta50 UI branch
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged topic branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/ux/beta50-zabbix-native-polish" >/dev/null 2>&1; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/ux/beta50-zabbix-native-polish"
            echo "Deleted ux/beta50-zabbix-native-polish"
          else
            echo "Branch already absent"
          fi
