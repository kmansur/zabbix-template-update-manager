services:
  postgres:
    image: ${POSTGRES_IMAGE}
    environment:
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix
      POSTGRES_DB: zabbix
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zabbix -d zabbix"]
      interval: 5s
      timeout: 5s
      retries: 30

  zabbix-server:
    image: ${ZABBIX_SERVER_IMAGE}
    init: true
    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix
      POSTGRES_DB: zabbix
    depends_on:
      postgres:
        condition: service_healthy

  zabbix-web:
    image: ${ZABBIX_WEB_IMAGE}
    environment:
      ZBX_SERVER_HOST: zabbix-server
      DB_SERVER_HOST: postgres
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix
      POSTGRES_DB: zabbix
      PHP_TZ: UTC
    ports:
      - "${ZTUM_SMOKE_PORT:-18080}:8080"
    volumes:
      - ../..:/usr/share/zabbix/modules/zabbix-template-update-manager:ro
    depends_on:
      postgres:
        condition: service_healthy
      zabbix-server:
        condition: service_started
